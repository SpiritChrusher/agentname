    <script>
        window.scrollTabIntoView = (el) => {
            if (!el || !el.scrollIntoView) return;
            el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // GitHub Pages cannot serve pre-compressed files with Content-Encoding, so fetch the
        // .br (or .gz) siblings that `dotnet publish` emits and decompress them natively.
        (() => {
            let codec = null;
            for (const [format, ext] of [['brotli', '.br'], ['gzip', '.gz']]) {
                try { new DecompressionStream(format); codec = { format, ext }; break; } catch { }
            }
            Blazor.start({
                loadBootResource(type, name, defaultUri, integrity) {
                    const path = new URL(defaultUri, document.baseURI).pathname;
                    if (!codec || !navigator.onLine || !(path.endsWith('.wasm') || path.endsWith('.dat'))) return;
                    return (async () => {
                        try {
                            const res = await fetch(defaultUri + codec.ext);
                            if (!res.ok || !res.body) throw new Error(res.status);
                            // Some servers (e.g. the dev server) send it with Content-Encoding, so the browser already decoded it.
                            const body = res.headers.get('content-encoding')
                                ? res.body
                                : res.body.pipeThrough(new DecompressionStream(codec.format));
                            const type = path.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
                            return new Response(body, { headers: { 'content-type': type } });
                        } catch {
                            return fetch(defaultUri);
                        }
                    })();
                }
            });
        })();
    </script>
